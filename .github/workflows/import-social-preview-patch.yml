name: Import prepared social preview patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.pull_request.head.ref == 'fix/social-preview-video-security'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/social-preview-video-security
          fetch-depth: 0
      - name: Apply committed feature patch and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patch-transfer/part-*.b64 | base64 --decode | gzip --decompress > /tmp/social-preview.patch
          git am /tmp/social-preview.patch
          rm -rf .github/patch-transfer
          rm -f .github/workflows/import-social-preview-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary patch transfer files"
          git push origin HEAD:fix/social-preview-video-security
