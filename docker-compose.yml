services:
  server:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data_sqlite:/var/lib/kutt
      - custom:/kutt/custom
    environment:
      DB_FILENAME: /var/lib/kutt/data.sqlite
      PORT: "3000"
    ports:
      - "${HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
volumes:
  db_data_sqlite:
  custom:
